apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nero-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    # Usiamo il rewrite standard
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  rules:
  - http:
      paths:
      - path: /argo
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
      - path: /anything
        pathType: Prefix
        backend:
          service:
            name: anythingllm-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openwebui-svc
            port:
              number: 80
