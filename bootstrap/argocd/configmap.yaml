apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-bootstrap-values
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-bootstrap
    app.kubernetes.io/part-of: gitops
data:
  appName: gitops-root
  # PUNTA AL TUO FORK
  repoURL: https://github.com/MassimoDanieli/gitops-control-plane.git
  # PUNTA AL TUO BRANCH
  targetRevision: feat/hardened-bootstrap
  appPath: bootstrap/hub
  clusterName: hub
  argocdNamespace: argocd
