# bootstrap/argocd/values.yaml
argo-cd:
  global:
    image:
      repository: bitnami/argo-cd
      tag: 2.13.3-debian-12-r0 # Versione stabile e sicura a fine 2025
      pullPolicy: IfNotPresent
  
  # Sicurezza per il Server API (Dashboard)
  server:
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    # Disabilita il TLS interno di Argo (lo gestirà l'Ingress di MicroK8s)
    extraArgs:
      - --insecure

  # Sicurezza per il Controller (quello che sincronizza i pod)
  controller:
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  # Sicurezza per il Repo Server (quello che legge GitHub)
  repoServer:
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
